worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Segurança — headers globais
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-XSS-Protection          "1; mode=block"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_geral:10m  rate=60r/s;
    limit_req_zone $binary_remote_addr zone=login:10m      rate=5r/m;
    limit_req_zone $binary_remote_addr zone=mfa:10m        rate=10r/m;

    # Ocultar versão do nginx
    server_tokens off;

    # ── Redirecionar HTTP → HTTPS ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS principal ────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        # ALTERAR: substituir pelo domínio real do hospital
        server_name curasphere.hospital.pt;

        # ── Restrição de rede — apenas LAN hospitalar e VPN ────────────────
        # ALTERAR: substituir pelos intervalos de IP reais da rede hospitalar
        # Exemplos: 192.168.0.0/16 = LAN típica; 10.0.0.0/8 = VPN ou rede interna maior
        allow 127.0.0.1;        # localhost (deploys locais / healthcheck)
        allow 192.168.0.0/16;   # LAN hospitalar (ajustar ao range real)
        allow 10.0.0.0/8;       # VPN hospitalar (ajustar ao range real)
        deny all;               # bloquear todo o tráfego externo

        # Certificados SSL — colocar em nginx/ssl/
        # Para Let's Encrypt: fullchain.pem e privkey.pem
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Configuração TLS moderna
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;
        ssl_stapling              on;
        ssl_stapling_verify       on;

        # HSTS (ativar só depois de SSL estar a funcionar corretamente)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Tamanho máximo de upload (exames, ficheiros)
        client_max_body_size 50M;

        # ── Auth — rate limit estrito ───────────────────────────────────────
        location = /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:3333/auth/login;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /api/auth/mfa/verificar {
            limit_req zone=mfa burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://api:3333/auth/mfa/verificar;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── WebSocket (Socket.IO) ───────────────────────────────────────────
        location /api/socket.io/ {
            proxy_pass             http://api:3333/socket.io/;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_set_header       X-Real-IP  $remote_addr;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # ── API geral ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_geral burst=100 nodelay;
            proxy_pass         http://api:3333/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Next.js — ficheiros estáticos (cache longa) ─────────────────────
        location /_next/static/ {
            proxy_pass http://web:3000/_next/static/;
            expires    365d;
            add_header Cache-Control "public, immutable";
        }

        # ── Web app (Next.js) ───────────────────────────────────────────────
        location / {
            proxy_pass         http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
