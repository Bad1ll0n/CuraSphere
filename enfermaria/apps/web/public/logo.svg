<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="sphereGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#60c8f5"/>
      <stop offset="50%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </radialGradient>
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#26d9c8"/>
      <stop offset="100%" stop-color="#00acc1"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1565c0" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sphere -->
  <circle cx="60" cy="60" r="44" fill="url(#sphereGrad)" filter="url(#shadow)"/>

  <!-- Ring / swoosh -->
  <ellipse cx="60" cy="60" rx="58" ry="18" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round"
    transform="rotate(-30 60 60)" opacity="0.9"/>
  <!-- Ring overlay to give depth (back half hidden by sphere) -->
  <clipPath id="frontClip">
    <rect x="0" y="50" width="120" height="70"/>
  </clipPath>
  <ellipse cx="60" cy="60" rx="58" ry="18" fill="none" stroke="#26d9c8" stroke-width="7" stroke-linecap="round"
    transform="rotate(-30 60 60)" clip-path="url(#frontClip)" opacity="0.95"/>

  <!-- White cross / plus -->
  <rect x="53" y="38" width="14" height="44" rx="4" fill="white" opacity="0.95"/>
  <rect x="38" y="53" width="44" height="14" rx="4" fill="white" opacity="0.95"/>

  <!-- Shine highlight -->
  <circle cx="48" cy="46" r="8" fill="white" opacity="0.25"/>
</svg>
