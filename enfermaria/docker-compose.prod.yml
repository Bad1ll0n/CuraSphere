# Docker Compose para PRODUÇÃO
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:

  # ── Base de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: curasphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-enfermaria}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - curasphere-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-enfermaria}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── Backup automático diário ───────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: curasphere-backup
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-enfermaria}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST:     postgres
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    networks:
      - curasphere-internal
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '0 2 * * * PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h $$POSTGRES_HOST -U $$POSTGRES_USER $$POSTGRES_DB | gzip > /backups/backup-$$(date +%Y%m%d_%H%M%S).sql.gz && find /backups -name \"*.sql.gz\" -mtime +30 -delete' | crontab -
        crond -f
      "

  # ── Cache (Redis) ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: curasphere-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - curasphere-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── API (NestJS) ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: curasphere-api
    restart: unless-stopped
    environment:
      DATABASE_URL:            "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-enfermaria}?schema=public"
      JWT_SECRET:              ${JWT_SECRET}
      JWT_EXPIRES_IN:          ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN:  ${JWT_REFRESH_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS:         ${ALLOWED_ORIGINS}
      REDIS_URL:               redis://redis:6379
      NODE_ENV:                production
      PORT:                    3333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - curasphere-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: curasphere-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - curasphere-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx (reverse proxy + SSL) ────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: curasphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - curasphere-internal
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  curasphere-internal:
    driver: bridge

volumes:
  postgres_data:
  nginx_logs:
