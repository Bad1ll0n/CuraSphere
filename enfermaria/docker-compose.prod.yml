# Docker Compose para PRODUÇÃO
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:

  # ── Base de dados ──────────────────────────────────────────────────────────
  postgres:
    # OPS-11: sem limite, os logs enchem o disco do host — a causa mais banal de
    # indisponibilidade num deployment de máquina única. 3 ficheiros de 20 MB por
    # serviço chegam para investigar um incidente sem arriscar o disco.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # OPS-15: sem limites, um serviço em fuga leva o host inteiro — incluindo a base
    # de dados. Num serviço de enfermaria isso é perder o registo clínico todo de uma
    # vez. ATENÇÃO: estes valores são um ponto de partida seguro e TÊM de ser
    # confirmados contra a máquina real; um limite curto demais mata o processo sob
    # carga, que é pior do que não ter limite nenhum.
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
        reservations:
          memory: 512M
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: curasphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-enfermaria}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # OPS-02 — PITR: cada segmento de WAL é arquivado (scripts/arquivar-wal.sh) assim que fecha,
    # e no máximo a cada 5 min (archive_timeout). Com o base backup semanal (scripts/basebackup.sh)
    # repõe-se a base para qualquer instante: RPO de minutos em vez de 24 h. Restauro:
    # scripts/restaurar-pitr.sh; ensaio automático: scripts/ensaio-pitr.sh (DR-RUNBOOK.md §7).
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /wal-arquivo /metricas && chown postgres:postgres /wal-arquivo /metricas
        exec docker-entrypoint.sh postgres \
          -c hba_file=/etc/postgresql/pg_hba.conf \
          -c wal_level=replica \
          -c archive_mode=on \
          -c archive_timeout=300 \
          -c 'archive_command=/scripts/arquivar-wal.sh %p %f' \
          -c max_wal_senders=3
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # OPS-01: o Postgres já não monta ./backups — não precisa, e montava-o em leitura-escrita.
      - wal_arquivo:/wal-arquivo
      - metricas_textfile:/metricas
      - ./scripts:/scripts:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - curasphere-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-enfermaria}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── Backup automático diário ───────────────────────────────────────────────
  backup:
    # OPS-11: sem limite, os logs enchem o disco do host — a causa mais banal de
    # indisponibilidade num deployment de máquina única. 3 ficheiros de 20 MB por
    # serviço chegam para investigar um incidente sem arriscar o disco.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # OPS-15: sem limites, um serviço em fuga leva o host inteiro — incluindo a base
    # de dados. Num serviço de enfermaria isso é perder o registo clínico todo de uma
    # vez. ATENÇÃO: estes valores são um ponto de partida seguro e TÊM de ser
    # confirmados contra a máquina real; um limite curto demais mata o processo sob
    # carga, que é pior do que não ter limite nenhum.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: curasphere-backup
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-enfermaria}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST:     postgres
      # OPS-08: os scripts usavam `./backups`, relativo ao directório de trabalho do cron —
      # que não é este volume. Sem isto, a cópia diária podia ficar dentro do contentor e
      # desaparecer com ele, com o log (esse sim em /backups) a dizer que tinha corrido bem.
      BACKUP_DIR:        /backups
      METRICAS_DIR:      /metricas
      WAL_ARQUIVO_DIR:   /wal-arquivo
      # ─── OPS-01 — cifra e cópia fora do host ─────────────────────────────
      # Sem BACKUP_AGE_RECIPIENT nem BACKUP_ENCRYPTION_KEY a rotina FALHA em vez de
      # escrever dados de saúde em claro (ver scripts/backup-cifra.sh).
      BACKUP_AGE_RECIPIENT:  ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_REMOTE:         ${BACKUP_REMOTE:-}
      RETENCAO_DIAS:         ${RETENCAO_DIAS:-30}
      WAL_RETENCAO_DIAS:     ${WAL_RETENCAO_DIAS:-8}
      RCLONE_CONFIG:         /config/rclone/rclone.conf
    volumes:
      - ./backups:/backups
      # Configuração do rclone para BACKUP_REMOTE (credenciais só de escrita).
      - ./backup-remoto:/config/rclone:ro
      # A rotina de cópia passa a ser um script versionado, não uma linha de
      # crontab embutida no compose (era impossível de testar e divergia do
      # `scripts/backup-db.sh` que existia em paralelo).
      - ./scripts:/scripts:ro
      # ─── OPS-01 — os uploads TÊM de entrar no backup ───────────────────────
      # Só-leitura: o contentor de backup nunca escreve no registo clínico.
      - api_uploads:/uploads-src:ro
      # OPS-02: o WAL arquivado (lido para o enviar cifrado para fora do host) e as métricas
      # para o node-exporter (idade do último backup, do último WAL, do base backup).
      - wal_arquivo:/wal-arquivo
      - metricas_textfile:/metricas
    networks:
      - curasphere-internal
    depends_on:
      postgres:
        condition: service_healthy
    # 02:00 — dump lógico diário (recurso independente do PITR); */5 — WAL para fora do host;
    # domingo 03:00 — base backup físico (ponto de partida do PITR).
    entrypoint: >
      sh -c "
        apk add --no-cache openssl tar age rclone >/dev/null 2>&1 || true;
        printf '%s\n'
          '0 2 * * * /scripts/backup-all.sh >> /backups/backup.log 2>&1'
          '*/5 * * * * /scripts/enviar-wal.sh >> /backups/wal.log 2>&1'
          '0 3 * * 0 /scripts/basebackup.sh >> /backups/basebackup.log 2>&1'
          | crontab -;
        crond -f
      "

  # ── Cache (Redis) ─────────────────────────────────────────────────────────
  redis:
    # OPS-11: sem limite, os logs enchem o disco do host — a causa mais banal de
    # indisponibilidade num deployment de máquina única. 3 ficheiros de 20 MB por
    # serviço chegam para investigar um incidente sem arriscar o disco.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # OPS-15: sem limites, um serviço em fuga leva o host inteiro — incluindo a base
    # de dados. Num serviço de enfermaria isso é perder o registo clínico todo de uma
    # vez. ATENÇÃO: estes valores são um ponto de partida seguro e TÊM de ser
    # confirmados contra a máquina real; um limite curto demais mata o processo sob
    # carga, que é pior do que não ter limite nenhum.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    container_name: curasphere-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - curasphere-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── API (NestJS) ───────────────────────────────────────────────────────────
  api:
    # OPS-11: sem limite, os logs enchem o disco do host — a causa mais banal de
    # indisponibilidade num deployment de máquina única. 3 ficheiros de 20 MB por
    # serviço chegam para investigar um incidente sem arriscar o disco.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # OPS-15: sem limites, um serviço em fuga leva o host inteiro — incluindo a base
    # de dados. Num serviço de enfermaria isso é perder o registo clínico todo de uma
    # vez. ATENÇÃO: estes valores são um ponto de partida seguro e TÊM de ser
    # confirmados contra a máquina real; um limite curto demais mata o processo sob
    # carga, que é pior do que não ter limite nenhum.
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
        reservations:
          memory: 512M
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # OPS-07: nome de imagem fixo, para o deploy guardar a versão em serviço
    # (`curasphere-api:anterior`) e voltar a ela se a nova não ficar saudável.
    # OPS-11: imagem versionada. Em produção vem do registry (release.yml), com
    # CURASPHERE_IMAGE_PREFIX=ghcr.io/<dono>/curasphere e CURASPHERE_VERSION=vX.Y.Z; o
    # `build:` acima só serve o modo `deploy.sh local` (construir no próprio servidor).
    image: ${CURASPHERE_IMAGE_PREFIX:-curasphere}-api:${CURASPHERE_VERSION:-local}
    container_name: curasphere-api
    restart: unless-stopped
    # ─────────────────────────────────────────────────────────────────────────
    # OPS-03 + OPS-13 — convenção deste bloco:
    #   ${VAR:?...}  = falha, não opção. `docker compose up` RECUSA arrancar e
    #                  diz porquê. É o mesmo padrão que o projecto já escolheu
    #                  no Joi (app.module.ts): recusar arrancar mal configurado
    #                  em vez de degradar em silêncio. Aplicado aqui porque o
    #                  compose é a camada que este agente controla.
    #   ${VAR:-...}  = opção com omissão segura (funcionalidade desligada).
    # Antes desta alteração, ~30 variáveis lidas pelo código NUNCA chegavam ao
    # contentor: o código lia `undefined` e caía em omissões pensadas para
    # desenvolvimento, em produção, sem ninguém dar por isso.
    # ─────────────────────────────────────────────────────────────────────────
    environment:
      DATABASE_URL:            "postgresql://${DB_USER:?DB_USER em falta no .env.prod}:${DB_PASSWORD:?DB_PASSWORD em falta no .env.prod}@postgres:5432/${DB_NAME:-enfermaria}?schema=public"
      # PERF-01: pool do `pg` (ver .env.example).
      DB_POOL_MAX:             ${DB_POOL_MAX:-20}
      DB_POOL_TIMEOUT_MS:      ${DB_POOL_TIMEOUT_MS:-10000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      JWT_SECRET:              ${JWT_SECRET:?JWT_SECRET em falta (min. 32 chars) — validado por Joi no arranque}
      JWT_EXPIRES_IN:          ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN:  ${JWT_REFRESH_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS:         ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS em falta — obrigatório em produção (Joi)}
      REDIS_URL:               redis://redis:6379
      NODE_ENV:                production
      PORT:                    3333
      SENTRY_DSN:              ${SENTRY_DSN:-}

      # ── Segredos criptográficos ────────────────────────────────────────────
      # Sem isto o middleware de encriptação faz no-op silencioso e guarda PII
      # (nome/contacto/morada de doentes) em texto simples na BD.
      ENCRYPTION_KEY:          ${ENCRYPTION_KEY:?ENCRYPTION_KEY em falta (64 hex) — sem ela a PII dos doentes fica em texto simples}
      # OPS-03 — CRÍTICO. A chave que assina os checkpoints de auditoria estava
      # ausente deste ficheiro E tem um valor por omissão publicado no
      # repositório ('dev-insecure-audit-signing-key-change-me', em
      # common/audit-checkpoint.service.ts). Com a omissão, os checkpoints são
      # assinados com uma chave que qualquer pessoa conhece: um DBA pode forjar
      # um checkpoint que valide dados adulterados. O serviço regista um
      # logger.error em produção mas ARRANCA na mesma — ou seja, a garantia de
      # inviolabilidade do registo de auditoria estava desligada sem falhar nada.
      # Guardar FORA da BD (secret manager). Gerar: openssl rand -hex 32
      AUDIT_SIGNING_KEY:       ${AUDIT_SIGNING_KEY:?AUDIT_SIGNING_KEY em falta — sem ela a auditoria é assinada com uma chave PÚBLICA e o tamper-proof não existe}
      AUDIT_CHECKPOINT_MS:     ${AUDIT_CHECKPOINT_MS:-60000}
      # Sink append-only FORA da BD. Fica dentro do volume de uploads para
      # sobreviver ao deploy e entrar na rotina de cópia (ver OPS-01).
      AUDIT_ANCHOR_FILE:       ${AUDIT_ANCHOR_FILE:-/app/uploads/audit-anchor.jsonl}
      # OBRIGATÓRIO se o quiosque de doente estiver activo — a API lança erro
      # ao gerar/validar tokens de quiosque sem isto.
      QUIOSQUE_SECRET:         ${QUIOSQUE_SECRET:-}

      # ── URL pública do frontend ────────────────────────────────────────────
      # Lida em auth/sso/sso.controller.ts para construir o redirect pós-SSO.
      # A omissão no código é 'http://localhost:4200': sem esta variável, o SSO
      # em produção devolve os utilizadores autenticados para localhost.
      NEXT_PUBLIC_WEB_URL:     ${NEXT_PUBLIC_WEB_URL:?NEXT_PUBLIC_WEB_URL em falta — o redirect de SSO cairia em http://localhost:4200}
      # A API também lê esta: auth/webauthn/webauthn.service.ts deriva dela o
      # `rpId` do WebAuthn (o hostname). A omissão no código é
      # 'http://localhost:3333' → as passkeys ficariam registadas contra o
      # domínio "localhost" e deixariam de autenticar em produção. Não é só
      # uma variável do frontend.
      NEXT_PUBLIC_API_URL:     ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL em falta — o rpId do WebAuthn cairia em 'localhost' e as passkeys deixariam de funcionar}

      # ── Endpoint de métricas (Prometheus) ──────────────────────────────────
      # common/metrics-scrape.guard.ts falha FECHADO em produção: sem este token
      # o /metrics devolve 401 e o sistema fica sem métricas nenhumas. Definir
      # se houver recolha (ver OPS-11). Gerar: openssl rand -hex 32
      METRICS_TOKEN:           ${METRICS_TOKEN:-}
      # Assinatura das etiquetas QR de medicação. Cai no JWT_SECRET quando
      # ausente (omissão segura), mas convém ser uma chave própria.
      MEDICACAO_QR_SECRET:     ${MEDICACAO_QR_SECRET:-}
      # Idade máxima de um token de quiosque (SEC-17). Omissão no código.
      QUIOSQUE_TOKEN_MAX_DIAS: ${QUIOSQUE_TOKEN_MAX_DIAS:-}

      # ── Armazenamento de objectos (documentos, DICOM, PDFs) ────────────────
      # 'local' guarda em /app/uploads (volume api_uploads, ver OPS-01).
      # 's3'/'minio' exigem as credenciais abaixo — sem elas os uploads falham
      # em runtime, não no arranque.
      STORAGE_PROVIDER:        ${STORAGE_PROVIDER:-local}
      S3_BUCKET:               ${S3_BUCKET:-curasphere}
      MINIO_BUCKET:            ${MINIO_BUCKET:-}
      MINIO_ENDPOINT:          ${MINIO_ENDPOINT:-}
      MINIO_PORT:              ${MINIO_PORT:-}
      MINIO_ACCESS_KEY:        ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY:        ${MINIO_SECRET_KEY:-}
      AWS_REGION:              ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID:       ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY:   ${AWS_SECRET_ACCESS_KEY:-}

      # ── Integrações clínicas externas ──────────────────────────────────────
      # Teleconsulta. A omissão no código é o servidor PÚBLICO meet.jit.si —
      # consultas clínicas a passar por infraestrutura de terceiros sem contrato
      # nem RGPD. Definir para o Jitsi da instituição.
      JITSI_SERVER:            ${JITSI_SERVER:?JITSI_SERVER em falta — a omissão do código é o servidor público meet.jit.si}
      # SPMS/SNS. A omissão do código é api-staging.spms.min-saude.pt: produção
      # a falar com staging é uma falha, não uma opção.
      SPMS_API_URL:            ${SPMS_API_URL:?SPMS_API_URL em falta — a omissão do código aponta para STAGING}
      SPMS_API_KEY:            ${SPMS_API_KEY:-}
      # 'sandbox' por omissão: em produção o PEM tem de ser explícito.
      SNS_PEM_MODE:            ${SNS_PEM_MODE:?SNS_PEM_MODE em falta — a omissão do código é 'sandbox'}
      SNS_PEM_ENDPOINT:        ${SNS_PEM_ENDPOINT:-}
      # Token do endpoint HL7. Omissão '' e o controlador falha FECHADO
      # (401 em /hl7/receive) — opção segura: vazio = integração HL7 desligada.
      HL7_API_TOKEN:           ${HL7_API_TOKEN:-}

      # ── IA clínica ─────────────────────────────────────────────────────────
      # Sem ANTHROPIC_API_KEY: AI Clínico e stewardship antibiótico desligados.
      # Sem OPENAI_API_KEY: a busca de guidelines cai em keyword cosine
      # similarity (degradação assumida, não falha).
      ANTHROPIC_API_KEY:       ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:          ${OPENAI_API_KEY:-}

      # ── Email transaccional ────────────────────────────────────────────────
      # Sem RESEND_API_KEY o mailer regista um aviso e ignora o envio — os
      # relatórios de turno deixam de sair sem nada falhar visivelmente.
      RESEND_API_KEY:          ${RESEND_API_KEY:-}
      MAIL_DOMAIN:             ${MAIL_DOMAIN:-curasphere.pt}
      RELATORIO_TURNO_EMAILS:  ${RELATORIO_TURNO_EMAILS:-}

      # ── Geofencing de turnos ───────────────────────────────────────────────
      # turnos.service.ts faz parseFloat(HOSPITAL_LAT ?? '0'): sem estes valores
      # o hospital fica em (0,0), ao largo da Guiné, e a validação de picagem
      # por localização rejeita toda a gente.
      HOSPITAL_LAT:            ${HOSPITAL_LAT:-}
      HOSPITAL_LON:            ${HOSPITAL_LON:-}
      HOSPITAL_GEOFENCE_METROS: ${HOSPITAL_GEOFENCE_METROS:-500}

      # ── Limites de pedidos e observabilidade ───────────────────────────────
      THROTTLE_LIMIT:          ${THROTTLE_LIMIT:-600}
      # Proxies de confiança para o req.ip (nginx na rede Docker). Ver main.ts.
      TRUST_PROXY:             ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      LOGIN_THROTTLE_LIMIT:    ${LOGIN_THROTTLE_LIMIT:-5}
      MFA_THROTTLE_LIMIT:      ${MFA_THROTTLE_LIMIT:-10}
      LOG_PRETTY:              ${LOG_PRETTY:-false}
      # Vazio = tracing OpenTelemetry desligado (gated em src/tracing.ts).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      # ─── OPS-01 — REGISTO CLÍNICO. NÃO REMOVER. ────────────────────────────
      # Sem este volume, os anexos de mensagens, imagens DICOM, fotografias de
      # doentes e PDFs de carta de alta viviam DENTRO do contentor: `deploy.sh`
      # faz `docker compose down` + `up`, o contentor é recriado do zero e todos
      # esses ficheiros desaparecem. Nunca entraram em backup nenhum.
      #
      # O caminho tem de ser exactamente /app/uploads: o código escreve em
      # `path.join(process.cwd(), 'uploads')` e o WORKDIR da imagem é /app
      # (apps/api/src/main.ts, common/storage.service.ts,
      # comunicacao/comunicacao.controller.ts).
      #
      # O `mkdir -p uploads/mensagens && chown nestjs` no Dockerfile continua a
      # ser necessário: no primeiro arranque o Docker copia o conteúdo (e o dono)
      # do directório da imagem para o volume vazio. Sem ele, o volume nasceria
      # pertencente a root e o processo (uid 1001) não conseguiria escrever.
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - curasphere-internal
    # OPS-06: liveness (sem I/O). A prontidão (BD, migrações, auditoria) é verificada pelo
    # deploy.sh e pela sonda do Prometheus em /v1/health/ready — se fosse o healthcheck, uma BD
    # em baixo faria o autoheal reiniciar em ciclo uma API que está bem.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"

  # ── Schema e triggers de auditoria (OPS-03) ────────────────────────────────
  # Execução única, corrida pelo `deploy.sh` antes de substituir a API:
  #   docker compose --profile deploy run --rm migrate
  # O perfil impede que um `up -d` o arranque. Usa o estágio `builder` da imagem
  # da API, que tem o workspace, o CLI do Prisma e os scripts — a imagem final só
  # leva o bundle.
  #
  # ARQ-11: `prisma migrate deploy` — aplica só as migrações versionadas em
  # apps/api/prisma/migrations, revistas em PR, na ordem e uma única vez. Se uma
  # falhar, o deploy pára aqui com a versão antiga ainda a servir. Os triggers de
  # auditoria aplicam-se depois (idempotente; cobre as tabelas novas).
  # Primeira vez numa BD criada por `db push`: ver apps/api/prisma/MIGRACOES.md.
  migrate:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    # OPS-11: imagem versionada. Em produção vem do registry (release.yml), com
    # CURASPHERE_IMAGE_PREFIX=ghcr.io/<dono>/curasphere e CURASPHERE_VERSION=vX.Y.Z; o
    # `build:` acima só serve o modo `deploy.sh local` (construir no próprio servidor).
    image: ${CURASPHERE_IMAGE_PREFIX:-curasphere}-migrate:${CURASPHERE_VERSION:-local}
    restart: "no"
    working_dir: /workspace/apps/api
    environment:
      DATABASE_URL: "postgresql://${DB_USER:?DB_USER em falta no .env.prod}:${DB_PASSWORD:?DB_PASSWORD em falta no .env.prod}@postgres:5432/${DB_NAME:-enfermaria}?schema=public"
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && node scripts/apply-audit-triggers.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - curasphere-internal

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  web:
    # OPS-11: sem limite, os logs enchem o disco do host — a causa mais banal de
    # indisponibilidade num deployment de máquina única. 3 ficheiros de 20 MB por
    # serviço chegam para investigar um incidente sem arriscar o disco.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # OPS-15: sem limites, um serviço em fuga leva o host inteiro — incluindo a base
    # de dados. Num serviço de enfermaria isso é perder o registo clínico todo de uma
    # vez. ATENÇÃO: estes valores são um ponto de partida seguro e TÊM de ser
    # confirmados contra a máquina real; um limite curto demais mata o processo sob
    # carga, que é pior do que não ter limite nenhum.
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Build-arg, não variável de runtime: fica cozido no bundle do Next.js.
        # Alimenta o URL do WebSocket (src/lib/use-socket.ts) E o `connect-src`
        # do CSP (src/lib/csp.ts). Se ficar vazio, o build produz um bundle que
        # tenta falar com localhost — indisponibilidade total, não um detalhe.
        NEXT_PUBLIC_API_URL:        ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL em falta — o bundle do web ficaria a apontar para localhost (WebSocket + CSP)}
        NEXT_PUBLIC_SENTRY_DSN:     ${NEXT_PUBLIC_SENTRY_DSN:-}
        # A página de teleconsulta faz `?? 'meet.jit.si'`: sem este build-arg, as
        # videochamadas clínicas passam pelo servidor Jitsi PÚBLICO. Como é
        # NEXT_PUBLIC_*, fica cozido no bundle — tem de ser build-arg, não env.
        NEXT_PUBLIC_JITSI_SERVER:   ${NEXT_PUBLIC_JITSI_SERVER:?NEXT_PUBLIC_JITSI_SERVER em falta — a teleconsulta cairia no servidor público meet.jit.si}
    # OPS-07: ver a nota da imagem da API.
    # OPS-11: imagem versionada. Em produção vem do registry (release.yml), com
    # CURASPHERE_IMAGE_PREFIX=ghcr.io/<dono>/curasphere e CURASPHERE_VERSION=vX.Y.Z; o
    # `build:` acima só serve o modo `deploy.sh local` (construir no próprio servidor).
    image: ${CURASPHERE_IMAGE_PREFIX:-curasphere}-web:${CURASPHERE_VERSION:-local}
    container_name: curasphere-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # TEM de ser o mesmo valor que a API — src/middleware.ts verifica a assinatura
      # JWT (HS256) server-side; sem isto o secret resolve para a string "undefined"
      # e todos os utilizadores autenticados são redirecionados para /login
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET em falta — o middleware do web rejeitaria todas as sessões}
      # Sentry server-side do Next.js (o DSN público é build-arg, este não).
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Origem pública do MinIO/S3. Os documentos e fotografias clínicas abrem-se por URL
      # assinado desse servidor; sem esta origem na CSP ficam em branco no browser.
      # Vazio com STORAGE_PROVIDER=local (servidos pela própria API).
      CSP_STORAGE_ORIGIN: ${CSP_STORAGE_ORIGIN:-}
      # `report-only` desliga o bloqueio sem novo build (a CSP passa a só reportar para
      # /api/v1/csp-report). Válvula para um incidente — não é para ficar assim.
      CSP_MODO: ${CSP_MODO:-}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - curasphere-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      autoheal: "true"

  # ── Nginx (reverse proxy + SSL) ────────────────────────────────────────────
  nginx:
    # OPS-11: sem limite, os logs enchem o disco do host — a causa mais banal de
    # indisponibilidade num deployment de máquina única. 3 ficheiros de 20 MB por
    # serviço chegam para investigar um incidente sem arriscar o disco.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # OPS-15: sem limites, um serviço em fuga leva o host inteiro — incluindo a base
    # de dados. Num serviço de enfermaria isso é perder o registo clínico todo de uma
    # vez. ATENÇÃO: estes valores são um ponto de partida seguro e TÊM de ser
    # confirmados contra a máquina real; um limite curto demais mata o processo sob
    # carga, que é pior do que não ter limite nenhum.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    # OPS-15: o ramo 1.27 do nginx deixou de ter suporte; 1.30 é o estável actual.
    image: nginx:1.30-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    container_name: curasphere-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # OPS-07: sem volume de logs — o nginx escreve para stdout/stderr (a imagem oficial liga
      # access.log/error.log a eles), com rotação pelo json-file e recolha pelo Alloy/Loki.
    depends_on:
      - api
      - web
    networks:
      - curasphere-internal
    # OPS-06: `nginx -t` só validava a sintaxe; isto confirma que o nginx responde.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      autoheal: "true"

  # ── Autoheal (OPS-06) ──────────────────────────────────────────────────────
  # O Docker sem orquestrador NÃO reinicia contentores unhealthy (`restart` só reage à saída
  # do processo): uma API com o event loop pendurado ficava unhealthy a receber tráfego. Este
  # serviço reinicia os contentores com a etiqueta `autoheal=true` (api, web, nginx).
  # Tem acesso ao socket do Docker — por isso é o único serviço com ele em produção, sem rede.
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    container_name: curasphere-autoheal
    restart: unless-stopped
    network_mode: none
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  # ══ Monitorização (OPS-05/07) — `docker compose --profile monitoring up -d` ═══
  # Grafana só em 127.0.0.1:3001 (túnel SSH ou VPN); nada disto é exposto ao público.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: curasphere-prometheus
    restart: unless-stopped
    environment:
      # Opcional no compose (o perfil base não o exige); este contentor recusa arrancar sem ele.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # O token de scrape da API fica num ficheiro dentro do contentor, nunca no repositório.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$METRICS_TOKEN" ] || { echo "METRICS_TOKEN em falta no .env.prod (openssl rand -hex 32)"; exit 1; }
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    container_name: curasphere-alertmanager
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    container_name: curasphere-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001
    # Sem password definida o Grafana usaria admin/admin: recusa arrancar.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_ADMIN_PASSWORD em falta no .env.prod"; exit 1; }
        exec /run.sh
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: curasphere-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/metricas
    pid: host
    volumes:
      - /:/host:ro,rslave
      - metricas_textfile:/metricas:ro
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: curasphere-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-enfermaria}?sslmode=disable"
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.97.0@sha256:f5f903fbe77571d455ede0453b084d6840bc62fc105efac001034421cab83b99
    container_name: curasphere-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: curasphere-cadvisor
    restart: unless-stopped
    command: ["--docker_only=true", "--housekeeping_interval=30s", "--disable_metrics=percpu,sched,tcp,udp,process,hugetlb,referenced_memory"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  blackbox:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    container_name: curasphere-blackbox
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.6.20@sha256:be040ec94865dabe4821ce1c0f109452bd4b5acb566ae376672696eb43caedb7
    container_name: curasphere-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./monitoring/loki/regras:/etc/loki/regras:ro
      - loki_data:/loki
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: curasphere-alloy
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks: [curasphere-internal]
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

networks:
  curasphere-internal:
    driver: bridge

volumes:
  postgres_data:
  # OPS-02: WAL arquivado (PITR). Copiado cifrado para fora do host a cada 5 min.
  wal_arquivo:
  # OPS-05: métricas escritas pelos scripts de backup/WAL, lidas pelo node-exporter.
  metricas_textfile:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
  # ─── OPS-01 — REGISTO CLÍNICO ───────────────────────────────────────────────
  # Anexos de mensagens, DICOM, fotografias de doentes e PDFs de carta de alta.
  # Sobrevive a `docker compose down` (que só remove contentores e redes).
  # NUNCA correr `docker compose down -v` neste stack: o `-v` apaga volumes
  # nomeados e destrói este e o `postgres_data` de forma irrecuperável.
  api_uploads:
