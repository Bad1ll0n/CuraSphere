packages:
  - 'packages/*'
  - 'apps/*'
  - 'libs/*'
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  detox: true
  dtrace-provider: true
  less: true
  nx: true
  sharp: true
  unrs-resolver: true

# Overrides de segurança: forçam a versão corrigida mais recente DENTRO da mesma major
# de dependências transitivas vulneráveis. Vivem aqui e não no campo `pnpm` do
# package.json, que as versões recentes do pnpm (e o Dependabot) deixaram de ler —
# os PRs do Dependabot regeneravam o lockfile sem eles e partiam o --frozen-lockfile.
overrides:
  '@grpc/grpc-js@>=1.0.0 <2.0.0': '^1.14.6'
  '@opentelemetry/api': '~1.9.1'
  '@xhmikosr/decompress@>=11.0.0 <12.0.0': '^11.1.4'
  '@xmldom/xmldom@>=0.8.0 <0.9.0': '~0.8.15'
  'axios@>=1.0.0 <2.0.0': '^1.20.0'
  'body-parser@>=2.0.0 <3.0.0': '^2.4.0'
  'brace-expansion@>=1.0.0 <2.0.0': '^1.1.21'
  'brace-expansion@>=2.0.0 <3.0.0': '^2.1.7'
  'brace-expansion@>=5.0.0 <6.0.0': '^5.0.12'
  'browserslist@>=4.0.0 <5.0.0': '^4.29.4'
  'compression@>=1.0.0 <2.0.0': '^1.8.2'
  'engine.io@>=6.0.0 <7.0.0': '^6.6.11'
  'follow-redirects@>=1.0.0 <2.0.0': '^1.16.2'
  'http-cache-semantics@>=4.0.0 <5.0.0': '^4.3.0'
  'image-size@>=2.0.0 <3.0.0': '^2.0.4'
  'isomorphic-ws>ws': '^8.22.0'
  'js-yaml@>=4.0.0 <5.0.0': '^4.3.2'
  'multer@>=2.0.0 <3.0.0': '^2.5.0'
  'nanoid@>=3.0.0 <4.0.0': '^3.3.20'
  'node-forge@>=1.0.0 <2.0.0': '^1.4.3'
  'piscina@>=4.0.0 <5.0.0': '^4.9.4'
  'postcss@>=8.0.0 <9.0.0': '^8.5.31'
  'proxy-addr@>=2.0.0 <3.0.0': '^2.0.8'
  'shell-quote@>=1.0.0 <2.0.0': '^1.12.0'
  'smol-toml@>=1.0.0 <2.0.0': '^1.9.1'
  'socket.io-parser@>=4.0.0 <5.0.0': '^4.2.7'
  'source-map-js@>=1.0.0 <2.0.0': '^1.2.2'
  'svgo@>=3.0.0 <4.0.0': '^3.3.5'
  'systeminformation@>=5.0.0 <6.0.0': '^5.33.19'
  'tar@>=7.0.0 <8.0.0': '^7.5.22'
  'tmp@>=0.2.0 <0.3.0': '~0.2.7'
  'undici@>=6.0.0 <7.0.0': '^6.29.1'
  'undici@>=7.0.0 <8.0.0': '^7.30.1'
  'ws@>=6.0.0 <7.0.0': '^6.2.6'
  'ws@>=7.0.0 <8.0.0': '^7.5.13'
  'ws@>=8.0.0 <9.0.0': '^8.22.0'
  'xmldom': 'npm:@xmldom/xmldom@~0.8.15'

# Advisories aceites, com justificação no .trivyignore da raiz do repositório.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-qr28-fpjm-wq7f
