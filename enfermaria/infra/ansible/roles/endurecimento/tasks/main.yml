---
# OPS-21 — endurecimento do host. Um servidor com dados de saúde (RGPD art. 9.º) não pode
# depender de quem o instalou se lembrar de cada passo.

- name: Utilizador de administração (sem password, só chave)
  ansible.builtin.user:
    name: "{{ admin_utilizador }}"
    groups: [sudo]
    append: true
    shell: /bin/bash
    password: "!"

# ── SSH ───────────────────────────────────────────────────────────────────────
- name: SSH — só chaves, sem root, sem encaminhamentos
  ansible.builtin.template:
    src: sshd-curasphere.conf.j2
    dest: /etc/ssh/sshd_config.d/90-curasphere.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Recarregar sshd

# ── Firewall ──────────────────────────────────────────────────────────────────
# A ordem importa: abrir o SSH da rede de administração ANTES de ligar a política "deny".
- name: SSH a partir da rede de administração
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item }}"
    comment: ssh-admin
  loop: "{{ ssh_redes_admin }}"

- name: HTTPS/HTTP a partir da LAN e VPN do hospital
  community.general.ufw:
    rule: allow
    port: "{{ item.1 }}"
    proto: tcp
    src: "{{ item.0 }}"
    comment: curasphere-web
  # OPS-19: com o portal/família públicos, 80/443 abrem a todos — é o nginx que restringe a
  # aplicação do pessoal à rede do hospital (nginx/rede-interna.conf). 80 também serve o ACME.
  loop: "{{ (['0.0.0.0/0'] if acesso_publico | default(false) else https_redes_permitidas) | product(['80', '443']) | list }}"

- name: Política por omissão — recusar entradas, permitir saídas; ligar
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
    logging: "low"

# O Docker publica portas com regras próprias de iptables que passam AO LADO do ufw. A
# configuração do daemon (papel docker) e o compose só publicam 80/443 do nginx; esta regra
# na cadeia DOCKER-USER garante que, mesmo que alguém publique outra porta por engano, só
# as redes permitidas lhe chegam.
- name: DOCKER-USER — só LAN/VPN do hospital chegam a portas publicadas pelo Docker
  ansible.builtin.template:
    src: docker-user.rules.j2
    dest: /etc/ufw/after.rules.d-curasphere
    owner: root
    group: root
    mode: "0644"
  notify: Aplicar regras DOCKER-USER

- name: Script que aplica as regras DOCKER-USER no arranque
  ansible.builtin.copy:
    dest: /etc/systemd/system/curasphere-docker-user.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=CuraSphere — regras DOCKER-USER (OPS-21)
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh /etc/ufw/after.rules.d-curasphere
      RemainAfterExit=true

      [Install]
      WantedBy=multi-user.target
  notify: Aplicar regras DOCKER-USER

# ── fail2ban ──────────────────────────────────────────────────────────────────
- name: Fail2ban para o SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/curasphere.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled  = true
      maxretry = 5
      findtime = 10m
      bantime  = 1h
  notify: Reiniciar fail2ban

# ── Kernel ────────────────────────────────────────────────────────────────────
- name: Sysctl de endurecimento
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-curasphere.conf
    reload: true
  loop: "{{ endurecimento_sysctl | dict2items }}"

# ── Auditoria do sistema ──────────────────────────────────────────────────────
- name: Auditd — quem mexe em contas, sudo, SSH, Docker e no .env
  ansible.builtin.template:
    src: auditd-curasphere.rules.j2
    dest: /etc/audit/rules.d/90-curasphere.rules
    owner: root
    group: root
    mode: "0640"
  notify: Carregar regras auditd

- name: Auditd ativo
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
