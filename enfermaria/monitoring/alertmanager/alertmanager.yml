# OPS-05 — encaminhamento dos alertas.
#
# CONFIGURAR ANTES DE PRODUÇÃO: o destino tem de ser alguém de serviço (on-call), não uma caixa
# de correio que ninguém lê. Por omissão envia email por SMTP; a password do SMTP fica num
# ficheiro fora do repositório (monitoring/segredos/smtp_password, montado só aqui).
# Para SMS/escalonamento (PagerDuty, Opsgenie), acrescentar o receiver respectivo e mudar a rota
# `severidade="critico"` para ele.
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.hospital.pt:587'
  smtp_from: 'curasphere-alertas@hospital.pt'
  smtp_auth_username: 'curasphere-alertas@hospital.pt'
  smtp_auth_password_file: '/etc/alertmanager/segredos/smtp_password'
  smtp_require_tls: true

route:
  receiver: equipa-ti
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Críticos: repetem de hora a hora até alguém resolver.
    - matchers: ['severidade="critico"']
      receiver: on-call
      repeat_interval: 1h

receivers:
  - name: equipa-ti
    email_configs:
      - to: 'ti@hospital.pt'
        send_resolved: true
  - name: on-call
    email_configs:
      - to: 'oncall@hospital.pt'
        send_resolved: true

inhibit_rules:
  # Com a BD em baixo, não vale a pena acordar alguém também por "API não pronta" e 5xx.
  - source_matchers: ['alertname="PostgresEmBaixo"']
    target_matchers: ['alertname=~"ApiNaoPronta|TaxaDeErros5xx|LatenciaP95Alta"']
