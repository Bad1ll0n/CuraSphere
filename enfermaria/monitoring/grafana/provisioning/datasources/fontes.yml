apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # O id de correlação (OPS-07) liga uma linha de log a todas as outras do mesmo pedido.
      derivedFields:
        - name: Pedido
          matcherRegex: '"(?:correlationId|request_id|reqId)":"([A-Za-z0-9._-]+)"'
          url: '{servico=~".+"} |= "$${__value.raw}"'
          datasourceUid: loki
