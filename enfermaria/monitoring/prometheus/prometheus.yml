# OPS-05 — Prometheus do CuraSphere (perfil `monitoring` do docker-compose.prod.yml).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    sistema: curasphere

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # API: /metrics exige o METRICS_TOKEN (Bearer). O entrypoint do contentor escreve-o neste
  # ficheiro a partir da variável de ambiente; não fica no repositório.
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['api:3333']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  # Sondas por dentro da rede: a API está pronta (BD, migrações, auditoria) e o web responde.
  - job_name: blackbox-interno
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:3333/v1/health/ready
          - http://web:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Sonda por fora: o endereço público, como o vê um enfermeiro (DNS, TLS, nginx). Também
  # mede a validade do certificado. Editar `alvos-externos.yml` com o domínio real.
  - job_name: blackbox-externo
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/alvos-externos.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
