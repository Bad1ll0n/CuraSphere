version: 2
updates:
  - package-ecosystem: npm
    directory: /enfermaria/apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    ignore:
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /enfermaria/apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /enfermaria
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
