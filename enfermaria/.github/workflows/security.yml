name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Segunda-feira às 06:00 UTC — scan semanal de vulnerabilidades
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Falha se encontrar vulnerabilidade de severidade alta ou crítica
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  snyk:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    # Só corre se SNYK_TOKEN estiver configurado
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

  gitleaks:
    name: Secrets Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install semgrep

      # SAST estático do código para falhas de segurança (injeção, XSS, auth, path traversal…).
      # Rulesets adequados ao stack + OWASP Top 10. Introduzido em modo NÃO-bloqueante: reporta
      # para o GitHub code scanning mas não falha o build enquanto o baseline não estiver limpo.
      # Passar a bloquear (remover continue-on-error e usar `--error`) quando o baseline estabilizar.
      - name: Semgrep scan
        continue-on-error: true
        run: >
          semgrep scan --sarif --output semgrep.sarif
          --config "p/typescript"
          --config "p/nodejsscan"
          --config "p/react"
          --config "p/owasp-top-ten"

      - name: Upload SARIF para code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  zap-dast:
    name: OWASP ZAP DAST (baseline)
    runs-on: ubuntu-latest
    # DAST precisa da app a correr, por isso NUNCA bloqueia PRs: corre só no scan semanal
    # (schedule) ou manualmente (workflow_dispatch). Arranca uma instância descartável da API
    # (Postgres + Redis como services, env de teste inline — não são segredos reais) e faz-lhe
    # um baseline scan. Se os comandos de build/migração mudarem, ajustar os passos abaixo.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enfermaria
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria
      REDIS_URL: redis://localhost:6379
      # Valores efémeros só para a instância de teste do scan — NÃO são segredos de produção.
      JWT_SECRET: ci-dast-throwaway-secret-000000000000000000000000000000000000
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      NODE_ENV: production
      LOG_PRETTY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Prisma migrate + generate
        continue-on-error: true
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build API
        run: npx nx build @org/api

      - name: Arrancar API em background
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3333/v1/health >/dev/null 2>&1; then echo "API pronta"; exit 0; fi
            sleep 5
          done
          echo "API não respondeu a tempo"; exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3333'
          # fail_action=false: reporta alertas (artefacto + issue) sem falhar o job no arranque
          fail_action: false
