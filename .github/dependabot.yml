version: 2
updates:
  # Workspace pnpm: o `pnpm-lock.yaml` está em /enfermaria, por isso o `directory` é a
  # raiz do workspace e não cada app. Com `/enfermaria/apps/api` e `/enfermaria/apps/web`
  # o Dependabot só mudava o package.json da app, sem lockfile, e os PRs partiam no
  # `pnpm install --frozen-lockfile` do CI. A partir da raiz atualiza os dois.
  - package-ecosystem: npm
    directory: /enfermaria
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # Dockerfiles live under each app, not at the workspace root — directory must
  # point exactly at the Dockerfile's folder (Dependabot does not scan recursively)
  - package-ecosystem: docker
    directory: /enfermaria/apps/api
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /enfermaria/apps/web
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  # OPS-15: as imagens do compose de produção (postgres, redis, nginx) estão fixadas por
  # digest; sem isto ninguém as actualizava.
  - package-ecosystem: docker-compose
    directory: /enfermaria
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  # Os workflows vivem em `.github/workflows/` na RAIZ do git (foram movidos de
  # `enfermaria/.github/`, onde o Actions nunca os lia). O Dependabot procura
  # workflows em `<directory>/.github/workflows` e não recorre a árvore, por isso
  # `directory` tem de ser `/` — com `/enfermaria` não encontrava nada.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
