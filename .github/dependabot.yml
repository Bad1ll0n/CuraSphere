version: 2
updates:
  - package-ecosystem: npm
    directory: /enfermaria/apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    ignore:
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /enfermaria/apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # Dockerfiles live under each app, not at the workspace root — directory must
  # point exactly at the Dockerfile's folder (Dependabot does not scan recursively)
  - package-ecosystem: docker
    directory: /enfermaria/apps/api
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /enfermaria/apps/web
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker

  # Os workflows vivem em `.github/workflows/` na RAIZ do git (foram movidos de
  # `enfermaria/.github/`, onde o Actions nunca os lia). O Dependabot procura
  # workflows em `<directory>/.github/workflows` e não recorre a árvore, por isso
  # `directory` tem de ser `/` — com `/enfermaria` não encontrava nada.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
