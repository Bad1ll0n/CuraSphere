name: CI — CuraSphere

# ─────────────────────────────────────────────────────────────────────────────
# ATENÇÃO: este ficheiro TEM de viver em `.github/workflows/` na raiz do
# repositório git (aqui), não em `enfermaria/.github/`. O GitHub Actions só lê
# workflows a partir da raiz do repositório — os workflows deste projecto
# estiveram em `enfermaria/.github/` e NUNCA correram.
# O workspace Nx vive em `enfermaria/`, daí o `working-directory` em todos os jobs.
#
# Havia DOIS ci.yml: este e um gerado pelo Nx em `enfermaria/.github/workflows/`
# que fazia `npm ci` num repositório pnpm sem `package-lock.json` — falhava
# sempre no primeiro passo. Ficou só este, em pnpm.
#
# ── Estrutura do gate (OPS-16), dois níveis ─────────────────────────────────
#   `verify`  — rápido e BLOQUEANTE por PR. Só contém verificações que estão
#               comprovadamente VERDES no baseline actual. É o único job que a
#               protecção de ramo deve exigir como required check.
#   `quality` — corre as mesmas ferramentas sobre o que ainda está VERMELHO no
#               baseline (hoje: só a formatação). Job inteiro
#               em continue-on-error: aparece na lista de checks e torna a
#               dívida visível, mas não reprova PRs enquanto o baseline não
#               estiver limpo. Ver NOTA DE DÍVIDA abaixo.
#   `e2e`     — lento e informativo: schedule nocturno, a pedido, ou PR com a
#               etiqueta `run-e2e`. Carga (k6) vive em `load.yml`.
#
# ── NOTA DE DÍVIDA (actualizada em 2026-11-06, ARQ-09/ARQ-10) ───────────────
#   lint      : 0 erros em todos os projectos (o cliente Prisma gerado deixou de ser
#               lintado — era 93 % dos erros). BLOQUEANTE em `verify`. Os avisos
#               (sobretudo `no-explicit-any` na web) continuam por reduzir.
#   typecheck : todos os projectos VERDES (api, shared, web, ui, mobile). BLOQUEANTE.
#   test      : @org/api e @org/web VERDES. BLOQUEANTES.
#   build     : @org/api e @org/web VERDES. BLOQUEANTE.
#   formatação: continua em `quality` (informativo) até o `nx format` ser aplicado.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Correr testes E2E (Playwright)'
        type: boolean
        default: false
  schedule:
    # Suite E2E nocturna — todos os dias às 02:00 UTC
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Só cancela runs em progresso em PRs; em main deixa terminar.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # O projecto exige pnpm >=10 e Node >=24.9 (engines em package.json): o NestJS 12 é só ESM
  # e o Jest só o carrega com require(esm) a partir do Node 24.9. O CI corre
  # na mesma major das imagens Docker de produção (apps/*/Dockerfile) — mudar as duas juntas.
  PNPM_VERSION: '10'
  NODE_VERSION: '26'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # NÍVEL 1 — gate rápido e BLOQUEANTE (cada push e cada PR)
  # Só entra aqui o que está verde no baseline. Um gate vermelho à nascença é
  # ruído que toda a gente aprende a ignorar — pior do que não ter gate.
  # ═══════════════════════════════════════════════════════════════════════════
  verify:
    name: Verificação (types · unit · build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: enfermaria

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: enfermaria/pnpm-lock.yaml

      # `pnpm install` corre build scripts só dos pacotes listados em
      # `pnpm.onlyBuiltDependencies` (package.json) e `allowBuilds`
      # (pnpm-workspace.yaml) — prisma, @swc/core, sharp, @node-rs/bcrypt…
      # NÃO acrescentar `--ignore-scripts`: parte o cliente Prisma e o SWC, e
      # já causou problemas neste repositório.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # ── Tipos (BLOQUEANTE) ─────────────────────────────────────────────────
      # ARQ-09: baseline a ZERO em todos os projectos (api, shared, web, ui, mobile) —
      # o web e o mobile deixaram o job `quality`. O cliente Prisma é gerado pelo target
      # `prisma-generate` (ARQ-10: deixou de estar no git), de que o typecheck depende.
      - name: TypeScript — verificar tipos (todos os projectos)
        run: pnpm exec nx run-many -t typecheck
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria_test
          JWT_SECRET: test-ci-secret-32-chars-minimo-curasphere!!

      # ── Lint (BLOQUEANTE) ──────────────────────────────────────────────────
      # ARQ-09: 93 % do "lint vermelho" era o cliente Prisma gerado (agora ignorado);
      # os erros reais foram corrigidos. Avisos não reprovam; erros sim.
      - name: Lint (todos os projectos)
        run: pnpm exec nx run-many -t lint

      # ── Testes unitários + cobertura (BLOQUEANTE) ──────────────────────────
      # Thresholds de cobertura impostos em apps/api/jest.config.js.
      # Só @org/api: a suite de @org/web tem 3 suites e 1 teste a falhar no
      # baseline (ver NOTA DE DÍVIDA) e corre no job `quality`.
      - name: Unit tests (api) com cobertura
        run: pnpm exec nx run @org/api:test --coverage --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria_test
          JWT_SECRET: test-ci-secret-32-chars-minimo-curasphere!!
          REDIS_URL: redis://localhost:6379/1
          NODE_ENV: test

      # ── Testes unitários da web (BLOQUEANTE) ───────────────────────────────
      # Verde desde 2026-11 (10 suites, 69 testes); saiu do job `quality`.
      - name: Unit tests (web)
        run: pnpm exec nx run @org/web:test --passWithNoTests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3333

      # ── Build (BLOQUEANTE) ─────────────────────────────────────────────────
      # Inclui `@org/web` (que também tem typecheck próprio, no passo de tipos).
      # `@org/mobile` fica de fora: o target `build` inferido pelo @nx/expo é um
      # build EAS (cloud da Expo, exige `eas-cli` e conta), não uma compilação local.
      - name: Build (api + web + libs)
        run: pnpm exec nx run-many -t build --exclude=@org/mobile
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria_test
          JWT_SECRET: test-ci-secret-32-chars-minimo-curasphere!!
          NEXT_PUBLIC_API_URL: http://localhost:3333
          NODE_ENV: production

      # ── Sanidade da infraestrutura (BLOQUEANTE, segundos) ──────────────────
      # Apanha erros de sintaxe/interpolação no compose antes de chegarem ao
      # servidor. Valores fictícios: valida-se a estrutura, não os segredos.
      - name: Validar docker-compose (dev + prod)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
        env:
          DB_USER: ci
          DB_PASSWORD: ci
          DB_NAME: enfermaria
          JWT_SECRET: ci-placeholder-secret-32-chars-minimo!!
          ENCRYPTION_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'
          AUDIT_SIGNING_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'
          ALLOWED_ORIGINS: https://exemplo.pt
          NEXT_PUBLIC_API_URL: https://exemplo.pt/api
          NEXT_PUBLIC_WEB_URL: https://exemplo.pt
          NEXT_PUBLIC_JITSI_SERVER: https://jitsi.exemplo.pt
          JITSI_SERVER: https://jitsi.exemplo.pt
          SPMS_API_URL: https://api.exemplo.pt
          SNS_PEM_MODE: sandbox
          ANTHROPIC_API_KEY: placeholder

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: enfermaria/apps/api/test-output/jest/coverage/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # NÍVEL 1b — qualidade: corre sempre, NÃO reprova (baseline ainda vermelho).
  # Existe para tornar a dívida visível e mensurável a cada PR. Cada linha
  # daqui muda-se para `verify` no dia em que o respectivo baseline chegar a
  # zero — ver NOTA DE DÍVIDA no topo do ficheiro.
  # ═══════════════════════════════════════════════════════════════════════════
  quality:
    name: Qualidade (lint · formato · types ui/mobile) — informativo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job inteiro não-bloqueante: aparece como check, nunca reprova o PR.
    continue-on-error: true
    defaults:
      run:
        working-directory: enfermaria

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `nx format:check` compara contra uma base; precisa do histórico.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: enfermaria/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação (nx format:check)
        continue-on-error: true
        run: pnpm exec nx format:check --base=origin/${{ github.event.pull_request.base.ref || 'main' }} --head=HEAD

      # Lint e typecheck de todos os projectos passaram para o job `verify` (ARQ-09).


  # ═══════════════════════════════════════════════════════════════════════════
  # NÍVEL 2 — E2E: lento e informativo. NÃO deve ser required check de PR.
  # Corre no schedule nocturno, a pedido, ou num PR com a etiqueta `run-e2e`.
  # ═══════════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E Playwright (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    defaults:
      run:
        working-directory: enfermaria

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enfermaria_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: enfermaria/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar browsers Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Migrar base de dados de teste
        working-directory: enfermaria/apps/api
        run: pnpm exec prisma db push --force-reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria_test

      # Os triggers de auditoria são criados por script, não pelo schema Prisma —
      # sem isto o E2E corre contra uma BD sem o trilho append-only e não
      # detecta regressões na auditoria (o mesmo passo existe no deploy).
      - name: Reinstalar triggers de auditoria
        run: node apps/api/scripts/apply-audit-triggers.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria_test

      - name: Build API
        run: pnpm exec nx build @org/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria_test
          JWT_SECRET: test-ci-secret-32-chars-minimo-curasphere!!

      - name: Arrancar API em background
        run: pnpm exec nx serve @org/api &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria_test
          JWT_SECRET: test-ci-secret-32-chars-minimo-curasphere!!
          ENCRYPTION_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'
          REDIS_URL: redis://localhost:6379/1
          PORT: 3333
          NODE_ENV: test
          ALLOWED_ORIGINS: http://localhost:3000

      - name: Arrancar Web em background
        run: pnpm exec nx serve @org/web &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3333

      - name: Aguardar servidores (API + Web)
        run: pnpm dlx wait-on http://localhost:3333/v1/health http://localhost:3000 --timeout 120000

      - name: Seed de dados de teste
        run: pnpm exec ts-node apps/web-e2e/fixtures/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enfermaria_test
          NEXT_PUBLIC_API_URL: http://localhost:3333
          TEST_USER: '00001'
          TEST_PASSWORD: Admin1234!
        continue-on-error: true

      - name: Correr testes Playwright
        run: pnpm exec playwright test --config=apps/web-e2e/playwright.config.ts
        env:
          BASE_URL: http://localhost:3000
          TEST_USER: '00001'
          TEST_PASSWORD: Admin1234!

      - name: Publicar relatório Playwright
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: enfermaria/apps/web-e2e/playwright-report/
          retention-days: 7

      - name: Publicar screenshots de falha
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results
          path: enfermaria/apps/web-e2e/test-results/
          retention-days: 7
